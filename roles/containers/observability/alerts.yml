{% raw %}
# Managed by Ansible - roles/containers/observability/alerts.yml
# Go templating below is wrapped in {% raw %} so Ansible leaves $labels alone.

groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} ({{ $labels.job }}) for 5 minutes."

      # Alloy pushes node and cadvisor metrics; if it dies those series just stop
      # rather than going up==0, so check for absence explicitly.
      - alert: AlloyNotReporting
        expr: absent(up{job="alloy"}) or absent(node_uname_info)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Alloy has stopped reporting host metrics"
          description: "No node metrics have arrived via remote_write for 10 minutes. Host and container metrics are blind."

      - alert: ServiceProbeFailed
        expr: probe_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Probe failing for {{ $labels.instance }}"
          description: "blackbox-exporter has been unable to get an acceptable response from {{ $labels.instance }} for 5 minutes."

  - name: certificates
    rules:
      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days"
          description: "Certificate expires in {{ $value | printf \"%.1f\" }} days. Check the cloudflare resolver in traefik.yml if renewal is stuck."

      - alert: CertificateExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 3 days"
          description: "Certificate expires in {{ $value | printf \"%.1f\" }} days. ACME renewal has almost certainly failed."

  - name: host
    rules:
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}) < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk free on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is at {{ $value | humanizePercentage }} free."

      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% disk free on {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is at {{ $value | humanizePercentage }} free."

      - alert: DiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"}[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} projected to fill within 24h"
          description: "Based on the last 6 hours of growth, {{ $labels.mountpoint }} on {{ $labels.instance }} runs out of space within a day."

      - alert: HighMemoryPressure
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90% on {{ $labels.instance }}"
          description: "Available memory has been under 10% for 15 minutes."

      - alert: HighCpuLoad
        expr: |
          100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 90% on {{ $labels.instance }}"
          description: "Sustained CPU utilisation of {{ $value | printf \"%.0f\" }}% for 30 minutes."

  - name: containers
    rules:
      - alert: ContainerRestartLoop
        expr: rate(container_start_time_seconds[15m]) > 0 and on (name) count_over_time(container_start_time_seconds[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "{{ $labels.name }} has restarted more than 3 times in 15 minutes."

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed"
          description: "{{ $labels.name }} hit its memory limit and was killed in the last 15 minutes."

  - name: observability-stack
    rules:
      - alert: LokiIngestionErrors
        expr: sum(rate(loki_request_duration_seconds_count{route=~"loki_api_v1_push", status_code=~"5.."}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki is rejecting log pushes"
          description: "Loki has been returning 5xx on the push path for 15 minutes. Logs are being dropped."

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Prometheus rule evaluations are failing"
          description: "Some alerting rules failed to evaluate, so the alerts they cover are not firing."
{% endraw %}
